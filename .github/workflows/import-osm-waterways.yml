name: import-osm-waterways

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region (de = alle Bundesländer, nw = NRW, …)"
        required: true
        default: "nw"
        type: choice
        options:
          - nw
          - de
          - sh
          - hh
          - ni
          - hb
          - he
          - rp
          - bw
          - by
          - sl
          - be
          - bb
          - mv
          - sn
          - st
          - th

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Import OSM waterways
        run: python scripts/import_osm_waterways.py --region "${{ inputs.region }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osm-waterways.geojson waterways.geojson waterways-manifest.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: OSM waterways import (${{ inputs.region }}) $(date -u +%Y-%m-%dT%H:%M)"
          git push
